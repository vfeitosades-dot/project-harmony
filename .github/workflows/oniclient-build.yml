name: Compilar ONICLIENT 1.21.11
on:
  push:
    branches: [oniclient-fabric-1.21.11]
    paths:
      - 'ONICLIENT/**'
      - '.github/workflows/oniclient-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Descompactar codigo
        run: |
          mkdir -p ONICLIENT/project
          base64 --decode ONICLIENT/oni-source.tar.xz.b64 | tar -xJ -C ONICLIENT/project
      - name: Compilar JAR
        working-directory: ONICLIENT/project
        run: gradle --no-daemon clean build
      - name: Verificar JAR Fabric e copiar
        run: |
          set -eu
          JAR=$(find ONICLIENT/project/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          test -n "$JAR"
          unzip -l "$JAR" | grep 'fabric.mod.json'
          cp "$JAR" ONICLIENT/ONICLIENT-1.21.11.jar
      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ONICLIENT-1.21.11-JAR
          path: ONICLIENT/ONICLIENT-1.21.11.jar
          if-no-files-found: error
      - name: Disponibilizar o JAR na branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ONICLIENT/ONICLIENT-1.21.11.jar
          git commit -m "build: publicar ONICLIENT Fabric 1.21.11" || exit 0
          git push

name: Build ONICRAFT Optimizer (Paper 1.21.11)
on:
  push:
    paths:
      - 'downloads/onicraft-optimizer/source.b64'
      - '.github/workflows/build-onicraft-optimizer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unpack source
        shell: bash
        run: |
          mkdir -p /tmp/onicraft-optimizer
          base64 -d downloads/onicraft-optimizer/source.b64 > /tmp/onicraft-optimizer/source.zip
          unzip -q /tmp/onicraft-optimizer/source.zip -d /tmp/onicraft-optimizer/code
          test -f /tmp/onicraft-optimizer/code/src/main/resources/plugin.yml
      - name: Compile against Paper
        id: compile
        shell: bash
        run: |
          set +e
          cd /tmp/onicraft-optimizer/code
          gradle --no-daemon clean build --stacktrace > /tmp/onicraft-optimizer/build-output.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -80 /tmp/onicraft-optimizer/build-output.log
          exit 0
      - name: Copy build and logs
        shell: bash
        run: |
          mkdir -p downloads/onicraft-optimizer
          cp /tmp/onicraft-optimizer/build-output.log downloads/onicraft-optimizer/build-log.txt
          if [[ "${{ steps.compile.outputs.exit_code }}" == "0" ]]; then
            cp /tmp/onicraft-optimizer/code/build/libs/ONICRAFT-Optimizer-1.0.0-beta.jar downloads/onicraft-optimizer/ONICRAFT-Optimizer-1.0.0-beta.jar
            jar tf downloads/onicraft-optimizer/ONICRAFT-Optimizer-1.0.0-beta.jar | grep -E 'plugin.yml|ONICRAFTOptimizer.class|Menus.class|PregenJob.class'
          else
            rm -f downloads/onicraft-optimizer/ONICRAFT-Optimizer-1.0.0-beta.jar
          fi
      - name: Publish build results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/onicraft-optimizer/build-log.txt
          git add -A downloads/onicraft-optimizer/ONICRAFT-Optimizer-1.0.0-beta.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Compile ONICRAFT Optimizer against official Paper API'
            git push
          fi
      - name: Ensure compile passed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1

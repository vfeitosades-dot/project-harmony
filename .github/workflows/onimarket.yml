name: Compilar OniMarket Fabric 1.21.11
on:
  workflow_dispatch:
  push:
    paths:
      - 'OniMarket/**'
      - '.github/workflows/onimarket.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build mod
        working-directory: OniMarket
        run: gradle clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OniMarket-1.21.11-JAR
          path: OniMarket/build/libs/*.jar
          if-no-files-found: error

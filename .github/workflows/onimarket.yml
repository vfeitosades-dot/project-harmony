name: Compilar OniMarket Fabric 1.21.11 + Paper
on:
  workflow_dispatch:
  push:
    paths:
      - 'OniMarket/**'
      - 'OniMarket-Server-Paper/**'
      - '.github/workflows/onimarket.yml'
permissions:
  contents: read
jobs:
  fabric-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Testar leitura de preços com 11 casos
        working-directory: OniMarket
        run: |
          mkdir -p /tmp/onimarket-tests
          javac -encoding UTF-8 -d /tmp/onimarket-tests src/main/java/br/com/onicraft/onimarket/PriceParser.java src/test/java/br/com/onicraft/onimarket/PriceParserSmoke.java
          java -cp /tmp/onimarket-tests br.com.onicraft.onimarket.PriceParserSmoke
      - name: Build mod
        working-directory: OniMarket
        run: gradle clean build --no-daemon
      - name: Verificar classes do mod
        working-directory: OniMarket
        shell: bash
        run: |
          test -f build/libs/OniMarket-1.21.11-1.4.0.jar
          jar tf build/libs/OniMarket-1.21.11-1.4.0.jar | grep 'OniMarketClient.class'
          jar tf build/libs/OniMarket-1.21.11-1.4.0.jar | grep 'PriceParser.class'
          jar tf build/libs/OniMarket-1.21.11-1.4.0.jar | grep 'fabric.mod.json'
      - uses: actions/upload-artifact@v4
        with:
          name: OniMarket-Fabric-1.21.11-JAR
          path: OniMarket/build/libs/*.jar
          if-no-files-found: error
  paper-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build Paper server plugin
        working-directory: OniMarket-Server-Paper
        run: gradle clean build --no-daemon
      - name: Verificar classes do plugin
        working-directory: OniMarket-Server-Paper
        shell: bash
        run: |
          test -f build/libs/OniMarket-Admin-Paper-1.21.11-1.4.0.jar
          jar tf build/libs/OniMarket-Admin-Paper-1.21.11-1.4.0.jar | grep 'OniMarketAdminPlugin.class'
          jar tf build/libs/OniMarket-Admin-Paper-1.21.11-1.4.0.jar | grep 'plugin.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: OniMarket-Positions-Paper-1.21.11-JAR
          path: OniMarket-Server-Paper/build/libs/*.jar
          if-no-files-found: error

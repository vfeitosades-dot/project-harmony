name: Compilar OniMarket Fabric 1.21.11 (mod único)
on:
  workflow_dispatch:
  push:
    paths:
      - 'OniMarket/**'
      - '.github/workflows/onimarket.yml'
permissions:
  contents: read
jobs:
  fabric-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Testar parser de precos
        working-directory: OniMarket
        run: |
          mkdir -p /tmp/onimarket-tests
          javac -encoding UTF-8 -d /tmp/onimarket-tests src/main/java/br/com/onicraft/onimarket/PriceParser.java src/test/java/br/com/onicraft/onimarket/PriceParserSmoke.java
          java -cp /tmp/onimarket-tests br.com.onicraft.onimarket.PriceParserSmoke
      - name: Build mod Fabric
        working-directory: OniMarket
        run: gradle clean build --no-daemon
      - name: Verificar arquivo JAR
        working-directory: OniMarket
        shell: bash
        run: |
          jar tf build/libs/OniMarket-1.21.11-1.5.0.jar | grep -q 'OniMarketClient.class'
          jar tf build/libs/OniMarket-1.21.11-1.5.0.jar | grep -q 'PriceParser.class'
          jar tf build/libs/OniMarket-1.21.11-1.5.0.jar | grep -q 'fabric.mod.json'
      - uses: actions/upload-artifact@v4
        with:
          name: OniMarket-1.21.11-Standalone-JAR
          path: OniMarket/build/libs/OniMarket-1.21.11-1.5.0.jar
          if-no-files-found: error

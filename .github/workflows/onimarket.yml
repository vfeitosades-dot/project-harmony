name: Compilar OniMarket Fabric 1.21.11 (mod único)
on:
  workflow_dispatch:
  push:
    paths:
      - 'OniMarket/**'
      - '.github/workflows/onimarket.yml'
permissions:
  contents: read
jobs:
  fabric-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Testar parser de precos
        working-directory: OniMarket
        run: |
          mkdir -p /tmp/onimarket-tests
          javac -encoding UTF-8 -d /tmp/onimarket-tests src/main/java/br/com/onicraft/onimarket/PriceParser.java src/test/java/br/com/onicraft/onimarket/PriceParserSmoke.java
          java -cp /tmp/onimarket-tests br.com.onicraft.onimarket.PriceParserSmoke
      - name: Testar sugestões durante digitação
        working-directory: OniMarket
        run: |
          mkdir -p /tmp/onimarket-search-tests
          javac -encoding UTF-8 -d /tmp/onimarket-search-tests src/main/java/br/com/onicraft/onimarket/SearchSuggestions.java src/test/java/br/com/onicraft/onimarket/SearchSuggestionsSmoke.java
          java -cp /tmp/onimarket-search-tests br.com.onicraft.onimarket.SearchSuggestionsSmoke
      - name: Testar analise de lucro, revenda e craft
        working-directory: OniMarket
        run: |
          mkdir -p /tmp/onimarket-profit-tests
          javac -encoding UTF-8 -d /tmp/onimarket-profit-tests src/main/java/br/com/onicraft/onimarket/ProfitEngine.java src/test/java/br/com/onicraft/onimarket/ProfitEngineSmoke.java
          java -cp /tmp/onimarket-profit-tests br.com.onicraft.onimarket.ProfitEngineSmoke
      - name: Testar navegação /shop ONICRAFT
        working-directory: OniMarket
        run: |
          mkdir -p /tmp/onimarket-shop-tests
          javac -encoding UTF-8 -d /tmp/onimarket-shop-tests src/main/java/br/com/onicraft/onimarket/ShopNavigator.java src/test/java/br/com/onicraft/onimarket/ShopNavigatorSmoke.java
          java -cp /tmp/onimarket-shop-tests br.com.onicraft.onimarket.ShopNavigatorSmoke
      - name: Verificar que o mod só consulta /shop
        working-directory: OniMarket
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/main/java/br/com/onicraft/onimarket/OniMarketClient.java').read_text()
          assert 'sendCommand("preco' not in s
          assert '"/preco"' not in s
          assert 'ClientReceiveMessageEvents' not in s
          assert 'ShopNavigator.isShopTitle(title)' in s
          assert 'ShopNavigator.isNextButton' in s
          assert 'aiPendingSince' in s
          assert 'ONIMARKET 2.1' in s
          print("Somente /shop, sem /preco e com navegação segura: OK")
          PY
      - name: Verificar 242 itens de referência
        working-directory: OniMarket
        run: |
          test "$(grep -vc '^#' src/main/resources/onimarket_reference_prices.tsv)" -eq 242
          grep -q '^DIAMOND' src/main/resources/onimarket_reference_prices.tsv
      - name: Verificar ordem de renderização da interface
        working-directory: OniMarket
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/main/java/br/com/onicraft/onimarket/OniMarketClient.java').read_text()
          render=s[s.index('        @Override public void render(GuiGraphics g,int mouseX,int mouseY,float delta) {'):]
          assert render.index('super.render(g,mouseX,mouseY,delta)') < render.index('if(playersTab) drawPlayers(g)'), 'A tabela precisa ser desenhada depois do fundo'
          assert 'Limpar busca' in s
          assert 'option.render(g,mouseX,mouseY,delta)' in s
          print('Ordem da renderização, botão Limpar e autocomplete: OK')
          PY
      - name: Verificar varredura completa e interface de resultados
        working-directory: OniMarket
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/main/java/br/com/onicraft/onimarket/OniMarketClient.java').read_text()
          required=['Varrer /shop inteiro','Revenda','Craft','Todos',
                    'seenItems.add(id);','aiPages++',
                    'stopAiScan("Última página da loja alcançada")',
                    'Nenhuma REVENDA LUCRATIVA','long completedQuotes']
          # O cabeçalho pode estar em maiúsculas, verificar sem case sensitive.
          for name in required:
              assert name.casefold() in s.casefold(), f"Falta recurso: {name}"
          assert 'Minecraft client=Minecraft.getInstance();' in s
          assert 'p.sell()>p.buy()' in Path('src/main/java/br/com/onicraft/onimarket/ProfitEngine.java').read_text(), 'Análise de revenda ausente'
          print("Dashboard, todos os itens, paginação e resultado pós-varredura: OK")
          PY
      - name: Build mod Fabric
        working-directory: OniMarket
        run: gradle clean build --no-daemon
      - name: Verificar arquivo JAR
        working-directory: OniMarket
        shell: bash
        run: |
          jar tf build/libs/OniMarket-1.21.11-2.1.0.jar > /tmp/onimarket-files.txt
          grep -q 'OniMarketClient.class' /tmp/onimarket-files.txt
          grep -q 'PriceParser.class' /tmp/onimarket-files.txt
          grep -q 'SearchSuggestions.class' /tmp/onimarket-files.txt
          grep -q 'ProfitEngine.class' /tmp/onimarket-files.txt
          grep -q 'ShopNavigator.class' /tmp/onimarket-files.txt
          grep -q 'fabric.mod.json' /tmp/onimarket-files.txt
          grep -q 'onimarket_reference_prices.tsv' /tmp/onimarket-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OniMarket-1.21.11-Standalone-JAR
          path: OniMarket/build/libs/OniMarket-1.21.11-2.1.0.jar
          if-no-files-found: error

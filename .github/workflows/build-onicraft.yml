name: Build ONICRAFT AnarchyCore
on:
  push:
    paths:
      - 'downloads/onicraft/ONICRAFT-src.b64'
      - '.github/workflows/build-onicraft.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Extract plugin source
        shell: bash
        run: |
          mkdir -p /tmp/onicraft-build
          base64 -d downloads/onicraft/ONICRAFT-src.b64 > /tmp/onicraft-build/src.zip
          unzip -q /tmp/onicraft-build/src.zip -d /tmp/onicraft-build/code
          test -f /tmp/onicraft-build/code/src/main/resources/plugin.yml
      - name: Build against official Paper 1.21.11 API
        working-directory: /tmp/onicraft-build/code
        run: gradle --no-daemon clean build --stacktrace
      - name: Publish JAR
        shell: bash
        run: |
          cp /tmp/onicraft-build/code/build/libs/ONICRAFT-AnarchyCore-3.0.0-beta.jar downloads/onicraft/ONICRAFT-AnarchyCore-3.0.0-beta.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/onicraft/ONICRAFT-AnarchyCore-3.0.0-beta.jar
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Build ONICRAFT AnarchyCore plugin with Paper API'
          git push

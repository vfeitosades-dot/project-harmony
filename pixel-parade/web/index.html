const pressed=new Set(),touch=new Set();document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','ArrowDown'].includes(e.code))e.preventDefault();pressed.add(e.code);if(e.repeat)return;if(e.code==='Escape'||e.code==='KeyP')pauseToggle();if(mode==='menu'){if(e.code==='Enter'||e.code==='Space')mode='select';if(e.code==='KeyC')coOp=!coOp} else if(mode==='select'){if(e.code==='ArrowRight'||e.code==='KeyD')sel=(sel+1)%bosses.length;if(e.code==='ArrowLeft'||e.code==='KeyA')sel=(sel+bosses.length-1)%bosses.length;if(e.code==='Enter'||e.code==='Space')begin(sel);if(e.code==='Escape')mode='menu'}else if(mode==='victory'||mode==='defeat'){if(e.code==='Enter'||e.code==='Space')mode='select'}if(e.code==='KeyM')music=!music});document.addEventListener('keyup',e=>pressed.delete(e.code));window.addEventListener('blur',()=>{pressed.clear();touch.clear();if(mode==='playing')pause=true});

function player(id){return{id,x:id?83:47,y:FLOOR-25,vx:0,vy:0,w:18,h:24,hp:4,maxHp:4,ground:true,face:1,ifr:0,shot:0,dash:0,dashCool:0,parry:0,parryCool:0,charge:0,down:false,wasJump:false,wasParry:false,wasDash:false,wasSpecial:false,score:0}}

function update(dt){if(mode!=='playing'||pause)return; t+=dt;boss.time+=dt;boss.clock+=dt;boss.y=142+Math.sin(boss.time*2.5)*11;boss.x=380+Math.sin(boss.time*.8)*11;const prev=boss.phase;boss.phase=boss.hp<boss.max*.3?2:boss.hp<boss.max*.65?1:0;if(prev!==boss.phase){flash=['SEGUNDO ATO!','TERCEIRO ATO!'][boss.phase-1];flashT=1.3;shake=7;spawn(boss.x,boss.y,C.pink,40,1.5);tone(220,.4,'sawtooth')}

function px(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function box(x,y,w,h,c,stroke=C.ink){px(x-2,y-2,w+4,h+4,stroke);px(x,y,w,h,c)}

function background(){const b=boss||bosses[sel];grad(b.theme[0],b.theme[1]);const s=Math.sin(t*.4);g.fillStyle='#ffffff24';for(let i=0;i<18;i++){const x=(i*81+20-t*(i%2+1)*3+800)%540-30,y=27+(i*47)%119;px(x,y,20+(i%3)*12,5,'#eaf5ee23');px(x+7,y-4,13,4,'#eaf5ee22')}

else if(b.kind==='jelly'){g.fillStyle='#eaa2e6';g.beginPath();g.arc(0,-8,37,Math.PI,0);g.lineTo(37,4);g.quadraticCurveTo(0,23,-37,4);g.fill();for(let i=0;i<6;i++){px(-30+i*11,6,5,18+Math.sin(t*4+i)*8,i%2?'#9bc9ea':'#cb8ce6')}box(-18,-10,11,8,'#292c56');box(8,-10,11,8,'#292c56');px(-10,8,20,3,'#69445d')}

else if(b.kind==='ghost'){g.fillStyle='#bce3e3';g.beginPath();g.moveTo(-32,22);g.lineTo(-32,-18);g.quadraticCurveTo(-30,-51,0,-48);g.quadraticCurveTo(31,-47,32,-18);g.lineTo(32,22);for(let i=0;i<5;i++)g.lineTo(30-i*15,24+(i%2)*8);g.fill();box(-17,-17,11,13,'#303356');box(9,-17,11,13,'#303356');px(-5,4,15,4,'#688ea0')}
else if(b.kind==='cactus'){box(-24,-31,48,65,'#74bd73');for(let a of [-1,1]){box(a*24-11,-2,12,17,'#74bd73');box(a*32-11,-20,11,19,'#74bd73')}box(-16,-12,9,10,C.ink);box(9,-12,9,10,C.ink);px(-13,8,25,4,'#f7d48d');for(let q=0;q<7;q++)px(-19+q*7,-25+(q%2)*8,2,5,'#dcf6b3')}
else{drawGear(0,0,37,'#aa79c3',-t*.4);box(-28,-23,56,48,'#a97bce');box(-15,-9,12,10,'#ffecba');box(7,-9,12,10,'#ffecba');box(-11,9,22,6,'#4f2454');px(-18,-37,38,9,'#f5bd77');px(-4,-51,10,15,'#ffc982')}
if(ph>0){g.strokeStyle=ph===2?C.pink:'#ffffae';g.lineWidth=ph+1;g.strokeRect(-44,-55,88,104)}g.restore()}
function drawHud(){px(5,5,171,29,'#161a34b9');for(const p of players){const x=p.id?92:12;txt(p.id?'P2':'P1',x,14,9,p.id?C.blue:C.gold);for(let i=0;i<p.maxHp;i++)txt(i<p.hp?'♥':'♡',x+22+i*10,14,11,i<p.hp?C.red:'#7b7790');txt('EX '+p.charge+'/3',x,26,8,p.id?C.blue:C.pink)}
px(255,6,218,30,'#141b32df');txt(boss.name,363,13,9,C.cream,'center');box(267,24,196,5,'#26334e');px(267,24,196*boss.hp/boss.max,5,boss.phase===2?C.pink:C.gold);txt(`ATO ${boss.phase+1}/3`,468,43,8,C.cream,'right');if(flashT>0){txt(flash,240,61,14,C.gold,'center')};if(pause){px(0,0,W,H,'#101320bf');txt('PAUSADO',240,117,27,C.gold,'center');txt('P / ESC / Ⅱ para voltar',240,150,10,C.cream,'center')}}
function btn(x,y,w,h,label,active=true){box(x,y,w,h,active?'#384a68':'#272e46');box(x+3,y+3,w-6,h-6,active?'#466e83':'#31374d');txt(label,x+w/2,y+h/2,11,active?C.cream:'#83879b','center')}
function frame(x,y,w,h){box(x,y,w,h,'#2b3554');px(x+3,y+3,w-6,h-6,'#324564')}
function drawMenu(){grad('#151d38','#40556d');for(let i=0;i<70;i++)px((i*73)%480,(i*41)%270,2,2,i%2?C.gold:'#b8f6e5');drawGear(70,144,42,'#c68d75',t*.2);drawGear(416,146,49,'#83a4b2',-t*.17);txt('PIXEL',240,61,46,C.gold,'center');txt('PARADE',240,104,48,C.cream,'center');txt('O CIRCO DAS FAÍSCAS',240,129,10,C.pink,'center');btn(123,156,110,30,'1 JOGADOR');btn(246,156,111,30,'2 JOGADORES');txt(coOp?'MODO ATUAL: CO-OP LOCAL':'MODO ATUAL: SOLO',240,202,12,C.mint,'center');txt('TOQUE NO MODO OU ENTER PARA COMEÇAR',240,223,9,C.cream,'center');txt('6 CHEFES • 3 ATOS • PARRY • DASH • ESPECIAL',240,251,8,'#b5dbe4','center')}
function drawSelect(){grad('#1c2344','#5e567b');txt('SELECIONE O CHEFE',240,22,20,C.gold,'center');for(let i=0;i<6;i++){let x=17+(i%3)*151,y=45+Math.floor(i/3)*84;box(x,y,139,74,i===sel?'#f0c676':'#35466a');px(x+3,y+3,133,68,bosses[i].theme[0]);drawMini(i,x+70,y+29);txt(bosses[i].name,x+69,y+59,8,C.cream,'center');if(i>unlocked){px(x+4,y+3,130,67,'#131827af');txt('BLOQUEADO',x+68,y+37,10,C.red,'center')}}txt('TOQUE EM UMA ARENA PARA JOGAR',240,234,10,C.cream,'center');txt(coOp?'COOPERATIVO LOCAL: 2 PERSONAGENS':'SOLO: 1 PERSONAGEM',240,252,9,C.mint,'center')}
function drawMini(i,x,y){const symbols=['⚙','◉','◕','♧','✿','✦'];txt(symbols[i],x,y,34,bosses[i].color,'center')}
function drawEnd(win){background();px(56,39,368,187,'#13182bd9');frame(65,48,350,169);txt(win?'VITÓRIA!':'TENTE DE NOVO',240,86,31,win?C.gold:C.pink,'center');txt(win?'VOCÊ DOMINOU A ARENA!':'O SHOW AINDA NÃO ACABOU...',240,122,12,C.cream,'center');txt(win?`NOVO CHEFE LIBERADO: ${Math.min(6,unlocked+1)}/6`:`CHEFE: ${bosses[sel].name}`,240,153,10,C.mint,'center');btn(137,179,206,28,'VOLTAR ÀS ARENAS')}
function drawGame(){background();g.save();if(shake>0)g.translate(Math.floor(rnd(-shake,shake)),Math.floor(rnd(-shake,shake)));drawBoss();for(const b of bullets){box(b.x-2,b.y-2,b.r*2,b.r*2,b.color)}for(const h of hazards){g.fillStyle=h.pink?C.pink:h.type==='meteor'?C.gold:'#b7a0ee';g.beginPath();g.arc(Math.floor(h.x),Math.floor(h.y),h.r,0,7);g.fill();g.strokeStyle=C.ink;g.lineWidth=2;g.stroke();if(h.pink){px(h.x-2,h.y-2,4,4,C.cream)}}for(const p of players)hero(p);for(const z of particles)px(z.x,z.y,z.s,z.s,z.c);g.restore();drawHud()}
function render(){g.clearRect(0,0,W,H);if(mode==='menu')drawMenu();else if(mode==='select')drawSelect();else if(mode==='playing')drawGame();else drawEnd(mode==='victory');for(let i=0;i<42;i++){g.fillStyle='#050d1612';px(i*12,0,1,H,'#08111f08')} }
function loop(now){let dt=Math.min(.034,(now-last)/1000||.0167);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.PixelParade={get state(){return{mode,coOp,sel,unlocked,bossHP:boss?.hp??0,players:players.map(p=>({hp:p.hp,x:p.x,y:p.y}))}},start:begin,setCoop(v){coOp=!!v},pause:pauseToggle};
})();
</script></body></html>
